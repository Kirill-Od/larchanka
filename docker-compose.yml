services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      # Именованный volume, иначе модель качается заново при каждом пересоздании
      - ollama_data:/root/.ollama
    # Порт наружу намеренно НЕ публикуется: у Ollama нет аутентификации,
    # доступ только из внутренней сети compose.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Перекрывает значение из .env: внутри compose Ollama живёт по имени сервиса
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    # Для TELEGRAM_TRANSPORT=webhook откройте порт обратному прокси,
    # который терминирует TLS (см. deploy/README.md):
    # ports:
    #   - "127.0.0.1:8080:8080"

volumes:
  ollama_data:
